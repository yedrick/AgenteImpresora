# Publica una version. Se dispara al subir una etiqueta v*, por ejemplo:
#
#   git tag v1.5.0 && git push origin v1.5.0
#
# Deja en la pagina de Releases los instaladores de Windows, Linux y macOS,
# los paquetes .deb para Debian y Ubuntu, el SDK empaquetado y las sumas
# SHA256 para comprobar las descargas.
name: Publicar version

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar, por ejemplo 1.5.0"
        required: true

permissions:
  contents: write     # para crear la Release y subirle los archivos
  id-token: write     # para publicar el SDK en npm con procedencia

jobs:
  comprobar:
    name: Comprobar antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache: true }

      - name: Pruebas con detector de carreras
        run: go test ./... -race -count=1

      - name: La version de la etiqueta coincide con la del SDK
        run: |
          etiqueta="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.version }}" ]; then etiqueta="${{ inputs.version }}"; fi
          sdk=$(node -p "require('./collatech-sdk/package.json').version")
          if [ "$etiqueta" != "$sdk" ]; then
            echo "La etiqueta dice $etiqueta y el SDK dice $sdk."
            echo "Sube la version en collatech-sdk/package.json o corrige la etiqueta."
            exit 1
          fi
          echo "Publicando $etiqueta"

  paquetes:
    name: Instaladores
    needs: comprobar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache: true }

      - name: Version
        id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Construir y empaquetar
        run: ./scripts/empaquetar.sh "${{ steps.v.outputs.version }}"

      # Sin firma, el boton "Buscar actualizacion" del panel se negaria a
      # instalar esta version. Por eso, si falta el secreto, la publicacion
      # falla aqui en vez de salir una version que nadie podria instalar
      # desde el panel. Como configurarlo: docs/ACTUALIZAR.md.
      - name: Firmar el manifiesto de actualizacion
        env:
          FIRMA_ACTUALIZACIONES: ${{ secrets.FIRMA_ACTUALIZACIONES }}
        run: go run ./cmd/firmar firmar dist/manifiesto.json

      - name: Comprobar que el .deb instala y el agente responde
        run: |
          sudo dpkg --install dist/collatech-agent_*_amd64.deb
          systemctl is-active --quiet collatech-agent
          for i in $(seq 30); do curl -sf http://127.0.0.1:18743/health && break; sleep 1; done
          curl -sf http://127.0.0.1:18743/health
          sudo dpkg --purge collatech-agent

      - uses: actions/upload-artifact@v4
        with:
          name: paquetes
          path: dist/*
          retention-days: 7

  sdk:
    name: SDK en npm
    needs: comprobar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: collatech-sdk/package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Construir y empaquetar
        working-directory: collatech-sdk
        run: |
          npm ci
          npm run build
          npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: sdk
          path: collatech-sdk/*.tgz

      # Solo publica si hay token. Sin el, la version sale igual y el .tgz
      # queda adjunto a la Release: se instala con
      #   npm install https://github.com/<usuario>/<repo>/releases/download/<tag>/collatech-sdk-<v>.tgz
      - name: Publicar en npm
        working-directory: collatech-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No hay secreto NPM_TOKEN: no se publica en npm."
            echo "El paquete va adjunto a la Release igualmente."
            exit 0
          fi
          npm publish --provenance --access public

  publicar:
    name: Crear la Release
    needs: [paquetes, sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: descargas }

      - name: Reunir los archivos
        run: |
          mkdir -p publicar
          find descargas -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.deb' \
            -o -name '*.tgz' -o -name 'SHA256SUMS.txt' -o -name 'actualizacion-*' \
            -o -name 'manifiesto.json' -o -name 'manifiesto.json.sig' \) -exec cp {} publicar/ \;
          # El boton del panel necesita todos: si falta alguno, no se publica.
          for f in manifiesto.json manifiesto.json.sig actualizacion-linux-amd64 \
                   actualizacion-linux-arm64 actualizacion-windows-amd64.exe actualizacion-windows-386.exe; do
            test -f "publicar/$f" || { echo "Falta $f para actualizar desde el panel"; exit 1; }
          done
          ls -lh publicar

      - name: Notas de la version
        id: notas
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; fi
          cat > NOTAS.md <<EOF
          ## Que descargar

          | Si tienes | Instalar por primera vez | Si ya tienes una version anterior |
          |---|---|---|
          | **Windows** | \`CollaTechAgent-$v-windows.zip\`: descomprime y ejecuta \`INSTALADOR.exe\` | Lo mismo. \`INSTALADOR.exe\` detecta la instalacion anterior y conserva la configuracion |
          | **Ubuntu o Debian** (PC normal) | \`collatech-agent_${v}_amd64.deb\`: \`sudo dpkg -i collatech-agent_${v}_amd64.deb\` | El mismo comando, encima de la version vieja. No pregunta nada ni toca \`config.json\` |
          | **Raspberry Pi o ARM** con sistema de 64 bits | \`collatech-agent_${v}_arm64.deb\`: \`sudo dpkg -i collatech-agent_${v}_arm64.deb\` | El mismo comando, encima de la version vieja |
          | **Otro Linux** (PC normal) | \`CollaTechAgent-$v-linux-amd64.tar.gz\`: descomprime y ejecuta \`sudo ./INSTALAR.sh\` | Descomprime el paquete nuevo y vuelve a ejecutar \`sudo ./INSTALAR.sh\`. Cambia el programa, reinicia el servicio y deja la configuracion como estaba |
          | **Otro Linux ARM** | \`CollaTechAgent-$v-linux-arm64.tar.gz\`: igual, con \`sudo ./INSTALAR.sh\` | Igual que el de arriba |
          | **Mac con chip Apple** | \`CollaTechAgent-$v-macos-apple.tar.gz\`: descomprime y ejecuta \`sudo ./INSTALAR.sh\` | Descomprime el paquete nuevo y vuelve a ejecutar \`sudo ./INSTALAR.sh\`. En Mac siempre se actualiza asi, a mano |
          | **Mac con Intel** | \`CollaTechAgent-$v-macos-intel.tar.gz\`: igual, con \`sudo ./INSTALAR.sh\` | Igual que el de arriba |

          Al terminar, el panel queda en **http://localhost:18743/panel**.

          ## Si ya lo tienes instalado

          - **Con la 1.6.4 o una mas nueva, en Windows o Linux:** no hace falta descargar nada. En la PC del agente abre el panel, pestaña **Estado**, tarjeta **Actualizaciones**, y pulsa **Buscar actualizacion** y luego **Instalar**. Comprueba la firma antes de instalar y, si la version nueva no arranca, vuelve sola a la anterior.
          - **Con una version anterior a la 1.6.4, o en Mac:** instala encima, siguiendo la ultima columna de la tabla.
          - En todos los casos se conservan el token, las webs autorizadas, la conexion con la nube y las impresoras dadas de alta.

          ## Para programar contra el agente

          \`\`\`bash
          npm install collatech-sdk@$v
          \`\`\`

          Si todavia no esta en npm, el paquete va adjunto aqui abajo:

          \`\`\`bash
          npm install https://github.com/${GITHUB_REPOSITORY}/releases/download/v$v/collatech-sdk-$v.tgz
          \`\`\`

          ## Comprobar la descarga

          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          files: publicar/*
          body_path: NOTAS.md
          generate_release_notes: true
          draft: false
