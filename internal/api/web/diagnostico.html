<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CollaTech Agent - Diagnostico</title>
  <link rel="stylesheet" href="/tema.css">
  <script src="/tema.js"></script>
  <style>
    /* La paleta esta en /tema.css. Esta pagina no tenia modo oscuro: al
       cambiar el tema desde el menu se quedaba en blanco mientras las otras
       dos se oscurecian. */
    :root {
      --muted:   var(--text2);
      --brand-2: var(--brand2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    header {
      background: var(--aviso);
      color: var(--aviso-tx);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
    main { max-width: 1180px; margin: 0 auto; padding: 22px; }
    nav { display: flex; gap: 10px; flex-wrap: wrap; }
    a, button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--brand);
      padding: 9px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 650;
      cursor: pointer;
      font-size: 14px;
    }
    button.primary {
      border-color: var(--brand-2);
      background: var(--brand-2);
      color: var(--brand-sv);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
      margin-top: 16px;
    }
    .card {
      grid-column: span 6;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      min-width: 0;
    }
    .card.full { grid-column: 1 / -1; }
    .card.third { grid-column: span 4; }
    h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }
    dl {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 8px 12px;
      margin: 0;
    }
    dt { color: var(--muted); }
    dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 700;
      border: 1px solid var(--line);
    }
    .status.ok   { color: var(--ok);   background: var(--ok-sw);   border-color: var(--ok); }
    .status.bad  { color: var(--bad);  background: var(--bad-sw);  border-color: var(--bad); }
    .status.warn { color: var(--warn); background: var(--warn-sw); border-color: var(--warn); }
    .hint { color: var(--text2); font-size: 12.5px; margin: 8px 0 0; }
    .list { display: grid; gap: 9px; }
    .url {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px;
      background: #fbfcfd;
      overflow-wrap: anywhere;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 0;
      max-height: 320px;
      overflow: auto;
      padding: 12px;
      background: #101820;
      color: #dbe4ee;
      border-radius: 6px;
      font-size: 12px;
    }
    .muted { color: var(--muted); }
    .loading { padding: 24px; color: var(--muted); }
    @media (max-width: 820px) {
      header { align-items: flex-start; flex-direction: column; }
      .card, .card.third { grid-column: 1 / -1; }
      dl { grid-template-columns: 1fr; }
      dt { font-weight: 700; }
    }
  </style>
</head>
<body>
  <div id="ct-menu"></div>
  <header>
    <div>
      <h1>CollaTech Agent - Diagnostico</h1>
      <div class="muted" id="subtitle">Verificando servidor local, red y firewall</div>
    </div>
    <nav>
      <!-- Los enlaces a las otras paginas los pone el menu compartido de
           arriba. Aqui quedaban los de antes y salian dos menus. -->
      <button class="primary" id="refresh">Actualizar</button>
      <button id="copy">Copiar reporte</button>
      <button id="download">Descargar JSON</button>
    </nav>
  </header>
  <main id="app"><div class="loading">Cargando diagnostico...</div></main>

  <script>
    let lastReport = null;

    const app = document.getElementById("app");
    const subtitle = document.getElementById("subtitle");
    document.getElementById("refresh").addEventListener("click", load);
    document.getElementById("copy").addEventListener("click", async () => {
      if (!lastReport) return;
      await navigator.clipboard.writeText(JSON.stringify(lastReport, null, 2));
      subtitle.textContent = "Reporte copiado al portapapeles";
    });
    document.getElementById("download").addEventListener("click", () => {
      if (!lastReport) return;
      const blob = new Blob([JSON.stringify(lastReport, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "collatech-diagnostico.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[c]));
    }

    function status(ok, label) {
      return `<span class="status ${ok ? "ok" : "bad"}">${ok ? "OK" : "FALLA"} ${esc(label || "")}</span>`;
    }

    // Una comprobacion que no aplica a este sistema, o que se omite a
    // proposito, no es un fallo. Antes salia en rojo junto a los de verdad
    // y tapaba lo que si importaba.
    function estadoDe(r) {
      if (!r) return `<span class="status warn">Sin datos</span>`;
      if (r.skipped || r.no_aplica) return `<span class="status">No aplica</span>`;
      return status(r.ok, r.status || r.error || "");
    }

    function dl(rows) {
      return `<dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;
    }

    // Cada sistema tiene su cortafuegos. Antes se pedian siempre las reglas
    // de netsh y en Linux o macOS salian tres bloques en ambar diciendo
    // "command only available on Windows", que no es un aviso: es ruido.
    function bloqueCortafuegos(f) {
      if (!f) return "";
      const partes = [];
      if (f.os === "windows") {
        partes.push(commandBlock("Firewall: regla del puerto", f.port_rule));
        partes.push(commandBlock("Firewall: regla del programa", f.program_rule));
      } else if (f.os === "linux") {
        partes.push(commandBlock("Cortafuegos (ufw)", f.ufw));
      } else if (f.os === "darwin") {
        partes.push(commandBlock("Cortafuegos de macOS", f.cortafuegos));
      }
      if (f.listen) partes.push(commandBlock("Puertos a la escucha", f.listen));
      if (f.como_abrir) {
        partes.push(`<div class="card"><h2>Como abrir el puerto</h2>
          <pre>${esc(f.como_abrir)}</pre></div>`);
      }
      return partes.join("");
    }

    function commandBlock(title, item) {
      const noAplica = item && item.no_aplica;
      const cls = noAplica ? "" : (item && item.ok ? "ok" : "warn");
      const txt = noAplica ? "No aplica" : (item && item.ok ? "OK" : "REVISAR");
      return `<div class="card">
        <h2>${esc(title)} <span class="status ${cls}">${txt}</span></h2>
        <pre>${esc((item && (item.detail || item.output || item.error)) || "Sin datos")}</pre>
      </div>`;
    }

    // Delegacion para los botones de copiar. Antes era un onclick inline
    // con el valor escapado como HTML, pero el navegador decodifica las
    // entidades del atributo antes de pasarlo al parser de JavaScript, asi
    // que ese escapado no protegia nada.
    document.addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-copiar]");
      if (!b) return;
      navigator.clipboard.writeText(b.dataset.copiar).then(
        () => { b.textContent = "Copiado"; },
        () => { b.textContent = "Copialo a mano"; }
      );
    });

    function render(report) {
      const data = report.data;
      lastReport = data;
      subtitle.textContent = `Generado: ${data.generated_at}`;
      const localhost = data.network.localhost_check || {};
      const lan = data.network.lan_checks || [];
      const urls = data.server.panel_urls || [];
      app.innerHTML = `
        <section class="grid">
          <div class="card third">
            <h2>Servidor</h2>
            ${dl([
              ["Estado local", status(localhost.ok, localhost.status || localhost.error || "")],
              ["Puerto", esc(data.server.port)],
              ["Host", esc(data.server.host)],
              ["Escucha", esc(data.server.listen_addr)],
              ["Acceso LAN", data.server.allow_remote ? status(true, "habilitado") : status(false, "bloqueado")],
              ["TLS", data.server.tls_enabled ? `<span class="status warn">HTTPS activo</span>` : `<span class="status ok">HTTP normal</span>`],
            ])}
          </div>
          <div class="card third">
            <h2>Equipo</h2>
            ${dl([
              ["Nombre PC", esc(data.network.hostname)],
              ["PID", esc(data.runtime.pid)],
              ["Sistema", esc(`${data.runtime.os}/${data.runtime.arch}`)],
              ["Ejecutable", esc(data.runtime.executable)],
              ["Carpeta", esc(data.runtime.working_dir)],
            ])}
          </div>
          <div class="card third">
            <h2>Consejos</h2>
            <div class="list">${(data.advice || []).map(x => `<div class="url">${esc(x)}</div>`).join("")}</div>
          </div>
          <div class="card full">
            <h2>URLs correctas</h2>
            <div class="list">${urls.map(u => `<div class="url"><span>${esc(u)}</span><button data-copiar="${esc(u)}">Copiar</button></div>`).join("")}</div>
          </div>
          <div class="card">
            <h2>Prueba 127.0.0.1</h2>
            ${dl([
              ["URL", esc(localhost.url)],
              ["Resultado", status(!!localhost.ok, localhost.status || localhost.error || "")],
              ["Tiempo", esc(`${localhost.ms ?? ""} ms`)],
              ["Respuesta", `<pre>${esc(localhost.body || "")}</pre>`],
            ])}
          </div>
          <div class="card">
            <h2>Prueba IP LAN</h2>
            <div class="list">${lan.map(x => `<div class="url"><span>${esc(x.url)}</span>${estadoDe(x.result)}</div>`).join("") || "Sin IP LAN detectada"}</div>
            ${(lan[0] && lan[0].result && lan[0].result.detail)
              ? `<p class="hint">${esc(lan[0].result.detail)}</p>` : ""}
          </div>
          ${bloqueCortafuegos(data.firewall)}
          <div class="card full">
            <h2>Configuracion activa</h2>
            ${dl([
              ["Archivo", esc(data.config.path)],
              ["JSON", `<pre>${esc(JSON.stringify(data.config.active, null, 2))}</pre>`],
              ["Archivo crudo", `<pre>${esc((data.config.raw && data.config.raw.text) || (data.config.raw && data.config.raw.error) || "")}</pre>`],
            ])}
          </div>
        </section>
      `;
    }

    // Lo que si se puede ver desde otra PC, para no dejar la pagina en
    // blanco: que el agente responde, su version y las impresoras.
    function soloEnSuPC() {
      const html = `
        <div class="card full">
          <h2>Este diagnostico solo se ve en la PC del agente</h2>
          <p>Muestra su configuracion completa, los puertos a la escucha y las reglas
             del cortafuegos, asi que no se sirve a traves de la red aunque tengas token.</p>
          <p><strong>Abrela en la PC donde corre el agente:</strong></p>
          <pre>http://localhost:18743/diagnostico</pre>
          <p>Desde aqui si puedes ver lo basico:</p>
          <div id="basico" class="list">Consultando...</div>
        </div>`;
      setTimeout(basicoDesdeLaRed, 0);
      return html;
    }

    async function basicoDesdeLaRed() {
      const caja = document.getElementById("basico");
      if (!caja) return;
      let token = "";
      try { token = localStorage.getItem("collatech.token") || ""; } catch (e) { /* modo privado */ }
      const cab = token ? { Authorization: "Bearer " + token } : {};
      const filas = [];

      try {
        const h = await fetch("/health", { cache: "no-store" });
        filas.push(["El agente responde", h.ok ? status(true, "si") : status(false, "no")]);
      } catch (e) {
        filas.push(["El agente responde", status(false, "no se pudo preguntar")]);
      }

      try {
        const r = await fetch("/api/status", { cache: "no-store", headers: cab });
        const j = await r.json();
        if (r.ok && j.data) {
          filas.push(["Version", esc(j.data.version || "?")]);
          filas.push(["Trabajos recientes", String((j.data.jobs || []).length)]);
        } else {
          filas.push(["Estado", status(false, (j && j.error) || "HTTP " + r.status)]);
        }
      } catch (e) { /* ya se dijo arriba */ }

      try {
        const r = await fetch("/api/network", { cache: "no-store", headers: cab });
        const j = await r.json();
        if (r.ok && j.data) {
          filas.push(["Nombre de la PC", esc(j.data.hostname || "?")]);
          filas.push(["Rutas para conectarse",
            (j.data.urls || []).map(u => `<div>${esc(u)}</div>`).join("") || "ninguna"]);
        }
      } catch (e) { /* opcional */ }

      caja.innerHTML = dl(filas);
    }

    async function load() {
      app.innerHTML = `<div class="loading">Cargando diagnostico...</div>`;
      try {
        // Se manda el token, por si el panel se abre desde otro equipo, y se
      // comprueba el estado: sin esto, un 403 acababa en "Cannot read
      // properties of undefined" en vez del motivo real.
      let token = "";
      try { token = localStorage.getItem("collatech.token") || ""; } catch (e) { /* modo privado */ }
      const res = await fetch("/api/diagnostico", {
        cache: "no-store",
        headers: token ? { Authorization: "Bearer " + token } : {},
      });
        const json = await res.json().catch(() => null);
      // Esta pagina muestra la configuracion completa del agente, el
      // netstat y las reglas del cortafuegos, asi que solo responde en su
      // propia PC. Antes se soltaba el JSON del 403 tal cual y parecia una
      // averia: no decia ni por que ni donde hay que abrirla.
      if (res.status === 403) {
        app.innerHTML = soloEnSuPC();
        return;
      }
      if (!res.ok || !json || !json.data) {
        const motivo = (json && json.error) || `El agente respondio HTTP ${res.status}.`;
        throw new Error(motivo);
      }
        render(json);
      } catch (err) {
        app.innerHTML = `<div class="card full"><h2>Error</h2><pre>${esc(err.message)}</pre></div>`;
      }
    }

    load();
  </script>
</body>
</html>
