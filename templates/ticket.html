<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
  <center><b>{{.empresa}}</b></center>
  <hr>
  <p>Cliente: {{.cliente}}</p>
  <hr>
  {{range .items}}
  <table>
    <tr><td>{{.nombre}}</td><td style="text-align:right">{{.precio}}</td></tr>
  </table>
  {{end}}
  <hr>
  <p style="text-align:right"><b>Total: {{.total}}</b></p>
  <hr>
  <center>Gracias por su compra!</center>
</body>
</html>
